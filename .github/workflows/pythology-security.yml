name: Pythology Security

on:
  pull_request:
  push:
    branches:
      - main
      - security/**
      - automation/upstream-sync

permissions:
  contents: read

jobs:
  invariants:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1

      - name: Verify Pythology lockdown invariants
        run: python3 scripts/check-pythology-security-invariants.py

      - name: Rust format check
        run: cargo fmt --all -- --check

  focused-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1

      - name: Focused security tests
        run: |
          cargo test -p xai-grok-tools shell_env_policy --lib
          cargo test -p xai-grok-sandbox profiles::tests --lib
          cargo test -p xai-grok-agent plugins::trust::tests --lib
          cargo test -p xai-grok-shell remote_fetch --lib
